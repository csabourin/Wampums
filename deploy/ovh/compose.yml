name: wampums

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  app:
    image: ${WAMPUMS_IMAGE:?Set WAMPUMS_IMAGE to the release image}
    init: true
    restart: unless-stopped
    env_file:
      - path: ${WAMPUMS_ROOT:?Set WAMPUMS_ROOT}/app.env
        format: raw
    environment:
      NODE_ENV: production
      PORT: '5000'
    volumes:
      - app-logs:/app/logs
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 20s
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAINS: ${APP_DOMAINS:?Set the public hostnames, separated by commas}
      UNIT_BASE_DOMAIN: ${UNIT_BASE_DOMAIN:-wampums.app}
      STORAGE_DOMAIN: ${STORAGE_DOMAIN:-files.wampums.app}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${WAMPUMS_ROOT}/tls:/etc/wampums/tls:ro
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging

  postgres:
    image: postgres:18-bookworm
    profiles: [database]
    restart: unless-stopped
    env_file:
      - path: ${WAMPUMS_ROOT}/postgres.env
        format: raw
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logging

  garage:
    image: dxflrs/garage:v2.4.1
    profiles: [storage]
    restart: unless-stopped
    command: ['/garage', 'server', '--single-node', '--default-bucket']
    env_file:
      - path: ${WAMPUMS_ROOT}/garage.env
        format: raw
    volumes:
      - ${WAMPUMS_ROOT}/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    logging: *logging

volumes:
  app-logs:
  caddy-data:
  caddy-config:
  postgres-data:
  garage-meta:
  garage-data:
