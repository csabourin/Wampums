name: CI Integrity

on:
  pull_request:
  push:
    branches:
      - main

# Every job only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-integrity-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  web-quality:
    name: Web quality and integrity gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Verify jsdom test environment dependency
        run: npm ls jest-environment-jsdom

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      # Every CLAUDE.md guardrail, ESLint included. Existing violations are
      # baselined (policy-baseline.json, eslint-suppressions.json): new ones
      # fail, and fixed ones must be removed from the baseline.
      - name: Lint and policy checks
        run: npm run lint:all

      - name: Build SPA
        run: npm run build

      - name: Run quality-focused Jest suite (non-integration)
        run: npm run test:quality

  database-integration:
    name: Integration tests on a database built from the repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The integration suites skip themselves without a database, so until this
    # job they never ran in CI -- and migrations lost from the repository went
    # unnoticed (see migrations/015_restore_lost_migrations.sql). This builds
    # the database the way a new deployment would: schema baseline, permission
    # catalog, then every migration.
    services:
      postgres:
        # Matches the server the schema baseline was dumped from.
        image: postgres:17
        env:
          # A throwaway database that lives only for this job: no password to
          # keep, and nothing for a secret scanner to mistake for one.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: wampums_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/wampums_test
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/wampums_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate a signing secret for this run
        run: echo "JWT_SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      # The container's psql matches the server and understands the dump's
      # \restrict guard, which older clients on the runner may not.
      - name: Load the schema baseline and permission catalog
        run: |
          docker exec -i ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U postgres -d wampums_test < attached_assets/Full_Database_schema.sql
          docker exec -i ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U postgres -d wampums_test < attached_assets/permissions_list.sql

      # The runner skips migrations recorded in schema_migrations, so a plain
      # second run proves nothing. Forgetting the records makes the second pass
      # execute every file again against the migrated schema, as CLAUDE.md
      # requires each migration to tolerate.
      - name: Apply every migration, then re-execute each one to prove it is re-runnable
        run: |
          npm run db:migrate:deploy
          docker exec -i ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U postgres -d wampums_test -c 'DELETE FROM schema_migrations'
          npm run db:migrate:deploy

      - name: Run the integration suites
        run: npx jest --runInBand --testPathPatterns 'integration\.test\.js$'


  accessibility:
    name: Accessibility in a real browser (WCAG 2.2 AA)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # jsdom cannot compute contrast, layout, focus visibility or what covers
    # what. This job builds and seeds a database, starts the API and the SPA
    # with the run-wampums scripts, and runs e2e/ in Chromium at phone and
    # desktop size, signed out and as a parent, a leader and an admin.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # The runner image ships PostgreSQL, stopped. The run-wampums scripts
      # reach it over the local socket as the current user.
      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          until pg_isready -h /var/run/postgresql; do sleep 1; done
          sudo -u postgres createuser --superuser "$USER"

      - name: Build and seed a disposable database
        run: |
          .claude/skills/run-wampums/db.sh
          node .claude/skills/run-wampums/seed.mjs

      - name: Start the API and the SPA
        run: .claude/skills/run-wampums/start.sh

      - name: Run the accessibility suite
        run: npm run test:a11y

      - name: Upload the report and server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-report
          path: |
            playwright-report/
            test-results/
            ~/.cache/wampums-run/logs/

  deploy-ovh:
    name: Deploy tested main commit to OVH
    needs: [web-quality, database-integration, accessibility]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.OVH_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ovh-production
    # Never interrupt a server migration or deployment already in progress.
    concurrency:
      group: ovh-production
      cancel-in-progress: false
    env:
      OVH_HOST: ${{ vars.OVH_HOST }}
      OVH_USER: ${{ vars.OVH_USER }}
      OVH_SSH_PORT: ${{ vars.OVH_SSH_PORT || '22' }}
    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build the production image
        env:
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ vars.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_VAPID_PUBLIC: ${{ vars.VITE_VAPID_PUBLIC }}
        run: |
          docker build -f Dockerfile.ovh --build-arg VITE_STRIPE_PUBLISHABLE_KEY --build-arg VITE_VAPID_PUBLIC -t "wampums:$GITHUB_SHA" .
          docker save "wampums:$GITHUB_SHA" | gzip > deploy/ovh/image.tar.gz

      - name: Configure authenticated SSH
        env:
          OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          OVH_SSH_KNOWN_HOSTS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$OVH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$OVH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$OVH_SSH_PORT" =~ ^[0-9]+$ ]]
          test -n "$OVH_SSH_PRIVATE_KEY"
          test -n "$OVH_SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$OVH_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$OVH_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Upload and activate the release
        run: |
          set -euo pipefail
          ssh_options=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15)
          target="$OVH_USER@$OVH_HOST"
          release="/opt/wampums/releases/$GITHUB_SHA"
          ssh "${ssh_options[@]}" -p "$OVH_SSH_PORT" "$target" "mkdir -p '$release'"
          scp "${ssh_options[@]}" -P "$OVH_SSH_PORT" deploy/ovh/{compose.yml,Caddyfile,deploy.sh,image.tar.gz} "$target:$release/"
          ssh "${ssh_options[@]}" -p "$OVH_SSH_PORT" "$target" "bash '$release/deploy.sh' '$GITHUB_SHA'"

      - name: Remove the SSH private key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
