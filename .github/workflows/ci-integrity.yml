name: CI Integrity

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-quality:
    name: Web quality and integrity gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Verify jsdom test environment dependency
        run: npm ls jest-environment-jsdom

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      # Every CLAUDE.md guardrail, ESLint included. Existing violations are
      # baselined (policy-baseline.json, eslint-suppressions.json): new ones
      # fail, and fixed ones must be removed from the baseline.
      - name: Lint and policy checks
        run: npm run lint:all

      - name: Build SPA
        run: npm run build

      - name: Run quality-focused Jest suite (non-integration)
        run: npm run test:quality

  database-integration:
    name: Integration tests on a database built from the repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The integration suites skip themselves without a database, so until this
    # job they never ran in CI -- and migrations lost from the repository went
    # unnoticed (see migrations/015_restore_lost_migrations.sql). This builds
    # the database the way a new deployment would: schema baseline, permission
    # catalog, then every migration.
    services:
      postgres:
        # Matches the server the schema baseline was dumped from.
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wampums_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wampums_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wampums_test
      JWT_SECRET_KEY: ci-integration-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      # The container's psql matches the server and understands the dump's
      # \restrict guard, which older clients on the runner may not.
      - name: Load the schema baseline and permission catalog
        run: |
          docker exec -i ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U postgres -d wampums_test < attached_assets/Full_Database_schema.sql
          docker exec -i ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U postgres -d wampums_test < attached_assets/permissions_list.sql

      - name: Apply every migration, then again to prove the run is idempotent
        run: |
          npm run db:migrate:deploy
          npm run db:migrate:deploy

      - name: Run the integration suites
        run: npx jest --runInBand --testPathPatterns 'integration\.test\.js$'

  web-tests-full-report:
    name: Web tests (full regression report, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    needs: web-quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Verify jsdom test environment dependency
        run: npm ls jest-environment-jsdom

      - name: Run full Jest suite and export report
        run: npx jest --runInBand --json --outputFile=jest-results.json

      - name: Upload full regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-results
          path: jest-results.json
